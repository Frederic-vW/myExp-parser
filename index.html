<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<title>Batch PDF Teacher/Course Satisfaction Extractor</title>

<!-- Load pdf.js -->
<script src="https://cdnjs.cloudflare.com/ajax/libs/pdf.js/2.16.105/pdf.min.js"></script>

<!-- Load SheetJS for Excel export -->
<script src="https://cdnjs.cloudflare.com/ajax/libs/xlsx/0.18.5/xlsx.full.min.js"></script>

<style>
body { font-family: Arial, sans-serif; margin: 30px; }
table { border-collapse: collapse; margin-top: 20px; width: 100%; }
th, td { border: 1px solid #ccc; padding: 8px; text-align: center; }
th { background: #f0f0f0; }
.ok { color: green; font-weight: bold; }
.err { color: red; font-weight: bold; }
button { margin-top: 10px; margin-right: 10px; }
</style>
</head>

<body>
<h2>Extract Mean & Median from UNSW MyExperience PDFs</h2>

<p>Select a folder containing multiple evaluation PDFs:</p>

<input type="file" id="folderInput" webkitdirectory directory multiple>
<button onclick="processFolder()">Process PDFs</button>

<!-- ✅ Export buttons -->
<button onclick="exportJSON()">Export JSON</button>
<button onclick="exportExcel()">Export Excel</button>

<h3>Results</h3>
<table id="resultsTable">
  <thead>
    <tr>
      <th>Filename</th>
      <th>Document Type</th>
      <th>Mean</th>
      <th>Median</th>
      <th>Status</th>
    </tr>
  </thead>
  <tbody id="resultsBody"></tbody>
</table>

<script>
// ------------------------------------------------------------
// Global storage for export
// ------------------------------------------------------------
let resultsData = [];

pdfjsLib.GlobalWorkerOptions.workerSrc =
  "https://cdnjs.cloudflare.com/ajax/libs/pdf.js/2.16.105/pdf.worker.min.js";


// ------------------------------------------------------------
// Find relevant block for teacher or course evaluation
// ------------------------------------------------------------
function findRelevantBlock(fullText) {
    const teacherPattern =
      /This teacher:\s*([^]*?)Overall I was satisfied with the quality of this person's teaching([^]{0,2000})/;

    const coursePattern =
      /This course:\s*([^]*?)Overall I was satisfied with the quality of the course([^]{0,2000})/;

    let match = fullText.match(teacherPattern);
    if (match) return { type: "Teacher", block: match[2] };

    match = fullText.match(coursePattern);
    if (match) return { type: "Course", block: match[2] };

    return { type: "Unknown", block: null };
}


// ------------------------------------------------------------
// Extract Mean + Median from block
// ------------------------------------------------------------
function extractStatsFromBlock(block) {
    if (!block) return { mean: null, median: null, ok: false };

    const meanMatch = block.match(/Mean\s+([0-9]+\.[0-9]+)/);
    const medianMatch = block.match(/Median\s+([0-9]+\.[0-9]+)/);

    return {
        mean: meanMatch ? meanMatch[1] : null,
        median: medianMatch ? medianMatch[1] : null,
        ok: !!(meanMatch && medianMatch)
    };
}


// ------------------------------------------------------------
// Extract stats from full PDF
// ------------------------------------------------------------
async function extractStatsFromArrayBuffer(arrayBuffer) {
    const pdf = await pdfjsLib.getDocument({ data: arrayBuffer }).promise;
    let fullText = "";

    for (let i = 1; i <= pdf.numPages; i++) {
        const page = await pdf.getPage(i);
        const content = await page.getTextContent();
        fullText += content.items.map(it => it.str).join(" ") + "\n";
    }

    const { type, block } = findRelevantBlock(fullText);
    const stats = extractStatsFromBlock(block);

    return { type, ...stats };
}


// ------------------------------------------------------------
// Process folder
// ------------------------------------------------------------
async function processFolder() {
    const input = document.getElementById("folderInput");
    const files = Array.from(input.files);
    const resultsBody = document.getElementById("resultsBody");

    // clear table + storage
    resultsBody.innerHTML = "";
    resultsData = [];

    for (const file of files) {
        if (!file.name.toLowerCase().endsWith(".pdf")) continue;

        const arrayBuffer = await file.arrayBuffer();
        const stats = await extractStatsFromArrayBuffer(arrayBuffer);

        // Add to HTML table
        const row = document.createElement("tr");
        row.innerHTML = `
            <td>${file.name}</td>
            <td>${stats.type}</td>
            <td>${stats.mean ?? "-"}</td>
            <td>${stats.median ?? "-"}</td>
            <td class="${stats.ok ? "ok" : "err"}">${stats.ok ? "OK" : "Not found"}</td>
        `;
        resultsBody.appendChild(row);

        // Add to export array
        resultsData.push({
            filename: file.name,
            type: stats.type,
            mean: stats.mean,
            median: stats.median,
            status: stats.ok ? "OK" : "Not found"
        });
    }
}


// ------------------------------------------------------------
// Export JSON
// ------------------------------------------------------------
function exportJSON() {
    const blob = new Blob([JSON.stringify(resultsData, null, 2)], {
        type: "application/json"
    });

    const a = document.createElement("a");
    a.href = URL.createObjectURL(blob);
    a.download = "evaluation_results.json";
    a.click();
}


// ------------------------------------------------------------
// Export Excel using SheetJS
// ------------------------------------------------------------
function exportExcel() {
    if (resultsData.length === 0) {
        alert("No data to export.");
        return;
    }

    const ws = XLSX.utils.json_to_sheet(resultsData);
    const wb = XLSX.utils.book_new();
    XLSX.utils.book_append_sheet(wb, ws, "Results");

    XLSX.writeFile(wb, "evaluation_results.xlsx");
}
</script>

</body>
</html>
